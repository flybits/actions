name: Reusable CodeQL analysis

on:
  workflow_call:
    inputs:
      web-app-name:
        description: 'A human-readable name of your web application'
        required: false
        type: string

    secrets:
      SLACK_BOT_TOKEN:
        description: 'A bot token to publish a message on Slack'
        required: true

jobs:
  analyze-code:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'javascript-typescript'

      - name: Force a failure for testing
        run: |
          echo "This is a test failure"
          exit 1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

      - name: Notify Slack on failure
        if: ${{ failure() }}
        uses: flybits/actions/frontend/slack/job-failure@main
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          message: '😟 CodeQL analyzing failed'
          web-app-name: ${{ inputs.web-app-name || github.event.repository.name }}
